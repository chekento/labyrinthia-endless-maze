<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Labyrinthia motion settings screenshot</title>
  <desc id="desc">Motion controls settings show a toggle, calibration action, sensitivity and inversion options.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060817"/><stop offset="1" stop-color="#201636"/></linearGradient>
    <linearGradient id="button"><stop stop-color="#36e0c5"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
  </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <g opacity=".4" fill="none" stroke="#26366f" stroke-width="20"><path d="M80 130h145V80h190v110h120M90 510h175v-84h160v110h150"/></g>
  <rect x="264" y="47" width="672" height="581" rx="28" fill="#0b1230" stroke="#ffc857" stroke-opacity=".6" stroke-width="2"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="316" y="112" font-size="17" font-weight="900" letter-spacing="3" fill="#ffc857">SETTINGS / INPUT</text><text x="316" y="166" font-size="38" font-weight="900" fill="#f3f6ff">Motion controls</text><text x="317" y="201" font-size="17" fill="#aeb9df">Guide the player by tilting your device.</text>
    <text x="316" y="266" font-size="20" font-weight="800" fill="#f3f6ff">Use device sensors</text><text x="316" y="295" font-size="16" fill="#aeb9df">The permission is requested only when enabled.</text>
    <rect x="786" y="244" width="76" height="40" rx="20" fill="#36e0c5"/><circle cx="842" cy="264" r="15" fill="#07131f"/>
    <rect x="316" y="338" width="270" height="58" rx="29" fill="url(#button)"/><text x="383" y="375" font-size="18" font-weight="900" fill="#06101f">CALIBRATE</text><text x="623" y="374" font-size="16" font-weight="800" fill="#36e0c5">READY</text>
    <text x="316" y="448" font-size="18" font-weight="800" fill="#f3f6ff">Sensitivity</text><rect x="500" y="437" width="290" height="11" rx="6" fill="#283766"/><rect x="500" y="437" width="191" height="11" rx="6" fill="#ffc857"/><circle cx="691" cy="442" r="14" fill="#f3f6ff" stroke="#ffc857" stroke-width="5"/><text x="810" y="448" font-size="16" fill="#aeb9df">2.2×</text>
    <text x="316" y="515" font-size="18" font-weight="800" fill="#f3f6ff">Invert tilt</text><rect x="786" y="493" width="76" height="40" rx="20" fill="#1a2752" stroke="#4a5e9e"/><circle cx="806" cy="513" r="15" fill="#8899c7"/>
    <text x="316" y="584" font-size="16" fill="#aeb9df">Hold the phone flat, tap calibrate, then tilt gently.</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="673.5" rx="29" fill="none" stroke="#ffc857" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
