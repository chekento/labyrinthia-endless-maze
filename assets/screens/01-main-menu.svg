<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Labyrinthia main menu screenshot</title>
  <desc id="desc">The Labyrinthia game main menu with a continue button, new expedition button and progression status.</desc>
