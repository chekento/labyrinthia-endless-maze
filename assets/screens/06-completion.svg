<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Labyrinthia level complete screenshot</title>
  <desc id="desc">A celebratory level complete screen shows XP earned and the next expedition button.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131d"/><stop offset="1" stop-color="#172956"/></linearGradient>
    <linearGradient id="cta"><stop stop-color="#36e0c5"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="220" fill="#36e0c5" opacity=".13" filter="url(#glow)"/>
  <g fill="none" stroke="#36e0c5" stroke-width="4" opacity=".55"><path d="M160 100h155V62h150v80h135"/><path d="M1040 544H890v-60H760v85H625"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="142" font-size="19" font-weight="900" letter-spacing="4" fill="#36e0c5">EXPEDITION COMPLETE</text>
    <text x="600" y="222" font-size="62" font-weight="900" fill="#f3f6ff">LEVEL 012 CLEARED</text>
    <text x="600" y="268" font-size="20" fill="#b8cbe8">The exit opened because you kept the line.</text>
    <rect x="360" y="321" width="480" height="115" rx="25" fill="#0c1733" stroke="#36e0c5" stroke-opacity=".55"/>
    <text x="420" y="365" text-anchor="start" font-size="17" font-weight="900" fill="#aeb9df">TIME</text><text x="420" y="404" text-anchor="start" font-size="28" font-weight="900" fill="#f3f6ff">01:58</text>
    <text x="600" y="365" text-anchor="start" font-size="17" font-weight="900" fill="#aeb9df">MOVES</text><text x="600" y="404" text-anchor="start" font-size="28" font-weight="900" fill="#f3f6ff">184</text>
    <text x="752" y="365" text-anchor="start" font-size="17" font-weight="900" fill="#aeb9df">REWARD</text><text x="752" y="404" text-anchor="start" font-size="28" font-weight="900" fill="#ffc857">+120 XP</text>
    <rect x="419" y="490" width="362" height="66" rx="33" fill="url(#cta)"/><text x="600" y="532" font-size="19" font-weight="900" fill="#06101f">NEXT EXPEDITION →</text>
    <text x="600" y="602" font-size="17" fill="#aeb9df">Rank 247 · 18 / 1000 achievements</text>
  </g>
  <circle cx="278" cy="260" r="6" fill="#ffc857"/><circle cx="926" cy="190" r="7" fill="#36e0c5"/><circle cx="1000" cy="350" r="5" fill="#ffc857"/>
  <rect x=".75" y=".75" width="1198.5" height="673.5" rx="29" fill="none" stroke="#36e0c5" stroke-opacity=".45" stroke-width="1.5"/>
</svg>
