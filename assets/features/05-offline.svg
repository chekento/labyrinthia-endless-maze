<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Offline-first Android play</title>
  <desc id="desc">A phone and a local storage shield illustrate fast offline play.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#092d3a"/></linearGradient>
    <linearGradient id="cyan"><stop stop-color="#36e0c5"/><stop offset="1" stop-color="#5de1ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="960" height="600" rx="32" fill="url(#bg)"/>
  <circle cx="730" cy="270" r="190" fill="#36e0c5" opacity=".1" filter="url(#glow)"/>
  <g transform="translate(594 78)">
    <rect x="0" y="0" width="216" height="366" rx="32" fill="#08101f" stroke="#5de1ff" stroke-width="7"/>
    <rect x="18" y="42" width="180" height="260" rx="16" fill="#132647"/>
    <path d="M34 100h55V70h44v52h55M34 180h42v-28h60v74h72M62 270h53v-35h53" fill="none" stroke="#36e0c5" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="104" cy="181" r="18" fill="#7c6cff" stroke="#f3f6ff" stroke-width="5"/>
    <rect x="75" y="331" width="66" height="7" rx="4" fill="#687c9e"/>
  </g>
  <g transform="translate(472 345)">
    <path d="M92 0l76 29v66c0 64-45 98-76 112-31-14-76-48-76-112V29z" fill="url(#cyan)" stroke="#d9fff8" stroke-width="6"/>
    <path d="M54 95l25 25 52-56" fill="none" stroke="#06202c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" fill="#f3f6ff">
    <text x="58" y="111" font-size="17" font-weight="900" letter-spacing="3" fill="#36e0c5">ANDROID-READY FOUNDATION</text>
    <text x="56" y="188" font-size="49" font-weight="900">PLAY OFFLINE</text>
    <text x="58" y="232" font-size="20" fill="#b7d6df">Fast startup. Local saves. No account wall.</text>
    <text x="58" y="570" font-size="27" font-weight="900">YOUR MAZE. YOUR DEVICE.</text>
  </g>
  <rect x=".75" y=".75" width="958.5" height="598.5" rx="31" fill="none" stroke="#5de1ff" stroke-opacity=".5" stroke-width="1.5"/>
</svg>
