<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Readable camera for large mazes</title>
  <desc id="desc">A player-centred camera keeps the blue player orb large while the maze continues beyond the viewport.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080c21"/><stop offset="1" stop-color="#121a42"/></linearGradient>
    <linearGradient id="glow"><stop stop-color="#36e0c5"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect width="960" height="600" rx="32" fill="url(#bg)"/>
  <circle cx="520" cy="325" r="120" fill="#36e0c5" opacity=".13" filter="url(#blur)"/>
  <g fill="none" stroke="#26326d" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 138H245V82H380V190H520V94H675V180H880"/>
    <path d="M55 310H180V230H305V376H426V270H610V430H770V320H912"/>
    <path d="M110 510H270V442H390V548H540V474H700V530H850"/>
  </g>
  <g fill="none" stroke="#36e0c5" stroke-width="7" opacity=".85"><path d="M86 138H245V82"/><path d="M55 310H180V230"/><path d="M540 474H700V530"/></g>
  <circle cx="520" cy="325" r="25" fill="#36e0c5" stroke="#d9fff8" stroke-width="7"/>
  <circle cx="520" cy="325" r="52" fill="none" stroke="#36e0c5" stroke-opacity=".35" stroke-width="3"/>
  <path d="M520 248V220M520 402V430M443 325H415M597 325H625" stroke="#d9fff8" stroke-width="5" stroke-linecap="round"/>
  <rect x="54" y="44" width="304" height="54" rx="27" fill="#111a3b" stroke="#36e0c5" stroke-opacity=".45"/>
  <text x="82" y="78" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="900" letter-spacing="2" fill="#f3f6ff">CAMERA FOCUS: PLAYER</text>
  <g font-family="Inter,Arial,sans-serif" fill="#f3f6ff">
    <text x="58" y="570" font-size="27" font-weight="900">READABLE AT ANY SCALE</text>
    <text x="60" y="536" font-size="17" fill="#aeb9df">Fixed cells + player-centred viewport</text>
  </g>
  <rect x=".75" y=".75" width="958.5" height="598.5" rx="31" fill="none" stroke="#7c6cff" stroke-opacity=".55" stroke-width="1.5"/>
</svg>
