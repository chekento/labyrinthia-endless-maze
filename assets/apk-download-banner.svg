<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Download Labyrinthia APK v2.2.1</title>
  <desc id="desc">A dark neon maze banner with a call to action for the Android pre-alpha build.</desc>
  <defs>
    <linearGradient id="shade" x1="0" x2="1">
      <stop offset="0" stop-color="#050918" stop-opacity=".98"/>
      <stop offset=".58" stop-color="#07152c" stop-opacity=".86"/>
      <stop offset="1" stop-color="#07152c" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" x2="1">
      <stop stop-color="#36e0c5"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <image href="./labyrinthia-marketing-background.jpg" x="0" y="0" width="1280" height="420" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1280" height="420" fill="url(#shade)"/>
  <circle cx="105" cy="110" r="84" fill="#36e0c5" opacity=".12" filter="url(#soft)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#f3f6ff">
    <text x="72" y="76" font-size="18" font-weight="800" letter-spacing="4" fill="#36e0c5">ANDROID PRE-ALPHA</text>
    <text x="68" y="150" font-size="66" font-weight="900" letter-spacing="7">LABYRINTHIA</text>
    <text x="73" y="190" font-size="25" font-weight="700" letter-spacing="5" fill="#cbd5ff">THE ENDLESS MAZE</text>
    <text x="74" y="244" font-size="19" fill="#dce5ff">Keep the player readable. Chase the key. Escape forever.</text>
  </g>
  <rect x="72" y="286" width="350" height="70" rx="35" fill="url(#pill)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#06101f">
    <text x="108" y="316" font-size="15" font-weight="900" letter-spacing="2">DOWNLOAD APK</text>
    <text x="108" y="341" font-size="21" font-weight="900">v2.2.1 · Android-ready</text>
  </g>
  <text x="455" y="329" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#dce5ff">Open the current build page →</text>
  <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="24" fill="none" stroke="#70f4df" stroke-opacity=".35" stroke-width="1.5"/>
</svg>
