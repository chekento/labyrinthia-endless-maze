<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Labyrinthia — The Endless Maze</title>
  <desc id="desc">A glowing procedural maze with a player, key and exit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070918"/><stop offset=".55" stop-color="#151744"/><stop offset="1" stop-color="#071d2a"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a696ff"/><stop offset=".52" stop-color="#746bff"/><stop offset="1" stop-color="#36e0c5"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7c6cff" stop-opacity=".45"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1190" cy="370" r="450" fill="url(#halo)" filter="url(#soft)"/>
  <g opacity=".18" stroke="#a696ff" stroke-width="1">
    <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/>
  </g>
  <g fill="none" stroke="url(#wall)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path stroke-width="8" d="M660 128H1450V235H1160V330H1375V438H1010V545H1240V663H890V772H470V650H270V530H510V420H365V302H590V215H660Z"/>
    <path stroke-width="3" opacity=".8" d="M690 165H1400M1210 270H1080V375H1320M1060 475H950V590H1180M850 705H520V610H340"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="590" cy="302" r="23" fill="#ffc857"/>
    <path d="M590 280v-28m-13 14h26M590 302a10 10 0 1 0 0 20a10 10 0 0 0 0-20Z" fill="none" stroke="#fff1b7" stroke-width="5"/>
    <circle cx="1010" cy="545" r="30" fill="#ff6b8a"/>
    <circle cx="1000" cy="535" r="9" fill="#ffd2dc"/>
    <circle cx="1019" cy="535" r="6" fill="#23132c"/>
    <path d="M1240 638v50m-24-25h48" stroke="#b5fff1" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g fill="#f3f6ff" font-family="Inter,Segoe UI,sans-serif">
    <text x="110" y="190" font-size="28" letter-spacing="11" fill="#36e0c5">PROCEDURAL ADVENTURE · INFINITE LEVELS</text>
    <text x="104" y="300" font-size="112" font-weight="900" letter-spacing="-5">LABYRINTHIA</text>
    <text x="112" y="365" font-size="30" letter-spacing="9" fill="#a696ff">THE ENDLESS MAZE</text>
    <text x="112" y="790" font-size="22" letter-spacing="3" fill="#9da8c9">FIND THE KEY · READ THE MAZE · ESCAPE THE IMPOSSIBLE</text>
  </g>
</svg>
