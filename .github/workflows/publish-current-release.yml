name: Publish Labyrinthia GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/app/build.gradle.kts'
      - 'downloads/Labyrinthia-*.apk'
      - '.github/workflows/publish-current-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve current version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'versionName = "' android/app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          test -n "$VERSION"
          APK="downloads/Labyrinthia-v${VERSION}-debug.apk"
          test -f "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APK="${{ steps.version.outputs.apk }}"
          mkdir -p release
          cp "$APK" "release/Labyrinthia-v${VERSION}-debug.apk"
          sha256sum "release/Labyrinthia-v${VERSION}-debug.apk" > "release/Labyrinthia-v${VERSION}-debug.apk.sha256"

      - name: Create or refresh versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          APK="release/Labyrinthia-v${VERSION}-debug.apk"
          SUM="${APK}.sha256"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM" \
              --target "$GITHUB_SHA" \
              --title "Labyrinthia ${VERSION} · Android Pre-Alpha" \
              --notes "Current Android Pre-Alpha build of Labyrinthia. This is a debug/test APK, not a final Play Store-signed release." \
              --prerelease
          fi
